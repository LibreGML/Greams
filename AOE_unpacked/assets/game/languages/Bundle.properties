10019 = 以下是《泰晤士报》对中国地区的报道（节选）  南京政府的进展让人诧异，他们在短短几个月的时间里就击败了众多军阀，成为这片土地上数一数二的豪强  但是，同时还有另一个豪强：前中央政府，现在叫中国临时政府。临时政府注重巩固自己的根据地，它很少向外扩张，但是也取得了不小的成就：它也占领了东北。  此情此景，不禁让人想到四十多年前的那场空前绝后的大决斗
