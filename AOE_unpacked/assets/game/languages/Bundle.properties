1930_005 = 华盛顿会议后，英国海上霸主的地位已然终结。为 了控制海军军备竞赛，也为了限制新兴国家的海军力量，1930年1月21日至4月22日，美国、英国、日本、法国、意大利五国政府代表在英国首都伦敦召开了限制和裁减海 军军备会议。因法国和意大利在争夺地中海霸权方面无法达成妥协而未能按规定交存批准书，故条约仅对按期交存了批准书的美国、英国和日本三国有效。 条约是对1922年2月美、英、日、法、意等国在华盛顿会议上所签署的《五国海军条约》的补充。依约， 对美、英、日三国所拥有的巡洋舰、驱逐舰及潜水艇的总吨位进行了限制。其中潜水艇吨位美、英、日，保持相当水平，而巡洋舰和驱逐舰的吨位 则沿用华盛顿会议规定的限制。
