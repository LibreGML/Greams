1930_011 = 虽然废除了封建帝制，但中国被帝国列强瓜分，国内 又处于北洋政府和蒋介石独裁政府的统治之下。虽然民族资本主义工业有-定发展，但仍然脆 弱,中国仍是以农业经济为主体的经济、形态;在帝国主 义的殖民统治下，中国的农业经济又具有殖民经济的性质,成为国外农产品的原料 输出基地。 同时由于刚刚脱胎于封建经济体制,又带有封建经济的性质。 1930年6月30日,国民政府颁布《中华民国土地法》。破天 荒的以法律制度的形式将土地制度确定下来，明确 了各项权，, 能。第一次对土地私有制 以法律形式得到确认，使土地制度成为一 部系统的、 完整的权能产权制度。这在中国法律史上,具有突破性和时代性的意义。同时， 该项土地法也废除了许多封建特性的.习惯、规定， 解放了土地权能的诸多束缚，特别废除了永佃制产生的地权分化制度,使土地权能.产权清晰，主体清楚 ,使扭曲的产权制度被纠正回来。
