1930_009 = 第一次世界大战后,战胜国迫使德国向法国和比利时保证莱茵兰非军事化。凡尔赛和约第42、第43、第44条对此作了明确规定。 1925年由德、法、英、意、比五国签订的《洛迦诺公约》对此再次作了重申。1930年6月30日，法国把它的最后一批军队撤出德国的莱茵兰，这一 做法也许是得不偿失的。法国比凡尔赛和约规定的日期提前5年撤出军队这主要应归功于德国的外.交部长古斯塔夫-斯特列斯曼,他是一位谈判能手。法国从这一行动中，将会得到什么好处现在尚不清楚。法军驻 在莱茵兰是为了保证德国遵守凡尔赛和约,不再重新武装。德国人一 直在反对占领.军，但是现在他们被不断增长的失业率和政治上的不稳定 弄得惶惶不安,他们对法国的提前撤军不见得会表示感谢。法国军队一走,德国就不得向莱茵河左岸派遣部队。德国还必须 尊重莱茵河东30英里的非军事区。这是凡尔赛和约原文所规定的，并且由德国在洛迦诺加以确认。负责监督。 占领的法国高级专员保尔-蒂拉德由于“完成了-项艰巨而又特别微妙的使命”受到外交部的祝贺。撤出莱茵兰对于法国军队而言，减轻了财政负担，也更多意味着莱茵河桥头堡方案失效了，法国将莱茵兰作为德法缓冲地带的意图破产了。
