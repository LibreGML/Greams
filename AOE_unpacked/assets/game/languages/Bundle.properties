1930_015 = 中原大战爆发后，远在东北的张学良一直声明中立，拒绝参加战争。  为笼络东北军，南京政府一直与张学良保持密切联系，同时还让与部分控制区。  9月1日，反蒋联军政府召开的扩大会议通过了“国民政府组织大纲”，  推举阎锡山、冯玉祥、李宗仁、汪精卫、唐绍仪、张学良、谢持等7人为国府委员，  以阎为主席。拟于新政府部会首长中，委以较多奉系人士。   9月2日，张学良当面向晋阎代表傅作义表示，他并未赞成新政府的成立。   除拒出任国府委员外，同时召回已被内定为北平国府部会首长的顾维钧、罗文干、汤尔和等人。  但却保荐且同意王家桢、胡若愚等就任南京国民政府外交部次长、青岛市长等职。  这实际标志着张学良已倒向南京。9月10日，张学良在北陵别墅召集东北军高级干部会议，决定出兵拥护南京中央。
1930_016 = 约法之争：胡汉民与蒋介石
1930_017 = 胡汉民曾是坚定的拥蒋派，他一生与蒋介石有过多次合作。早年，是胡汉民向孙文荐言，  引蒋介石入粤军以牵制粤军总司令陈炯明。陈炯明叛乱后，  胡汉民和蒋介石也一直是孙文身边的“反陈联盟”骨干。后蒋介石曾多次提出辞职，胡汉民也屡屡从中斡旋。  孙文创办黄埔军校，胡、蒋再次合作。1927年4月南京国民政府成立之后，  以黄埔系坐大的蒋介石，借助胡汉民党内威望，推胡出任南京国民政府主席，  与自视“正统”的武汉国民政府争夺国民党中枢。宁汉合流后，蒋下野，汪精卫拉拢胡，  胡闭门不见，后忿而出国。次年汪精卫出走，蒋、胡再度合作，在南京政府共同主事。  这次胡、蒋合作最为密切，但亦导致最激烈的冲突，  并引发国民党内部一场重大政潮，从此胡、蒋分道扬镳，在国民党内造成严重分裂。
1930_018 = 约法之争：前因
1930_019 = 所谓“约法”，即指孙文1906年所提出革命三程序：“军法之治”、“约法之治”  与“宪法之治”三时期中“约法"。在孙文看来，结束军政至宪治建立民权之间，  需要经过一个过渡期即为训政时期。孙文认为，训政时期，需同时制定约法，  以规定政府和人民之间的权利与义务。此后孙文对“三段论”  作过多次说明，但原则大致如此。二次革命失败后，孙文痛定思痛，  于1923年接受苏俄“党治”观念，1924年正式将“以党治国”作为国民党的治国纲领。  孙文临死前公布的《建国大纲》，对“训政时期”再作说明时，没有出现“约法”二字。  1928年，实现全国统一的国民党已从革命党转向执政党，并率领国民从事国家建设任务。  依据孙文所定的建国程序，军政结束，训政开始。  由于训政是否要制定约法，孙文没有留下具体方策，  因而在党的决议上，出现前后不一的议案。
1930_020 = 约法之争
1930_021 = 1928年，由蒋介石主持的国民党二届五中全会将“以党治国”的政治体制初步确立下来。  全会通过“训政时期，应遵照总理遗嘱，颁布约法”的决议，  “起草并颁布约法”被明确提到党的议事日程。  这是孙文逝世后国民党第一次正式提出起草、颁布约法。但胡汉民并不知道全会已通过约法的决议。  1929年3月15日，由胡汉民主持的国民党三全大会召开，  大会追认了二届五中全会提出的《训政纲领》，在法理上，  将党权推到至高无上的地位，并确认中央政治制度改革案等。  取而代之的是大会确立了以总理遗教为国家根本大法。  1930年11月12日，国民党三届四中全会在南京召开。  在是否召开国民会议和制定约法的议题上，胡汉民与蒋介石矛盾公开化。  以孙文思想自居的胡汉民与欲想实现个人独裁的蒋介石一直不分胜负。  唇枪舌战，都想说服对方。一向以“独立大精神”自称的胡汉民，  其个性不易妥协，这也正是胡在国民党内始终拥有一定影响力的原因所在。  形势对蒋介石显然不利。1931年2月18日，  蒋介石赴汤山“闭户自省”，考虑对付胡汉民的办法。
1930_022 = 约法之争：汤山事件
1930_023 = 1931年2月28日，蒋介石以宴请议事为名，请胡汉民到总司令部。  次日，胡汉民提出辞呈，“所有党部政府职务，概行辞去”。  胡随后被押送南京郊外汤山温泉别墅软禁。  胡汉民和蒋介石的约法之争，最后竟酿成一件令全国哗然的政治事件，  以胡汉民被关押收场。
1930_024 = 约法之争：宁粤对峙
1930_025 = 汤山事件最终引起公愤。  1931年5月27日，两广军阀陈济棠、李宗仁以及汪精卫派、  孙科派、西山会议派等国民党派系在广州成立  国民党中央执监委员会非常会议，经该会决议成立国民政府。  5月28日，广州国民政府正式成立。  1931年9月1日，广州国民政府下达总动员令，出师讨蒋。
1930_026 = 九一八事变
1930_027 = 1931年9月18日晚，在日本关东军的安排下，铁路“守备部队”  炸毁了沈阳柳条湖附近的南满铁路轨道，嫁祸于中国军队。  日军以此为借口炮轰沈阳北大营，九一八事变爆发。
1930_028 = 约法之争：结果-粤系的割据
1930_029 = 九一八事变后，蒋张二人声望同时跌倒谷底，  蒋介石不得已释放胡汉民，以下野为代价实现了宁粤合流。  但远在广州的陈济棠因汤山事变全面控制了广东军政大权，  最终割据一方、对抗南京。陈济棠藉由  成立各种军事、政务等机关，在宁粤复合后，继续维持其半独立局面。
1930_030 = 东北陷落
1930_031 = 中华苏维埃共和国成立
1930_032 = 从1927年10月毛泽东率领秋收起义部队开始创建井冈山根据地，  到1931年秋短短的4年时间里，中国共产党领导人民创建了十多块“工农武装割据”  的农村革命根据地，掀起了土地革命的高潮。然而，  由于中华民国政府的严密封锁、积极围剿，  加上交通阻隔，各根据地和红军的斗争活动基本上是各自为政，  难以形成合力，迫切需要建立一个全国性的政权来加强领导、统一步调。  1931年11月7日，中华苏维埃共和国临时中央政府在江西中央苏区成立，定都瑞金。
1930_033 = 宁都起义
1930_034 = 1931年12月14曰，由赵博生、董振堂等同志领导的宁都起义爆发，并获得成功。
1930_035 = 不抵抗政策
1930_036 = 一二八淞沪抗战
1930_037 = 1932年1月28日午夜，日本海军第一遣外舰队司令盐泽幸一指挥海军陆战队  分三路突袭上海闸北，第十九路军在总指挥蒋光鼐、  军长蔡廷锴指挥下奋起抵抗，给日军以迎头痛击。日军对我军阵地及民宅、  商店狂轰滥炸，发动了四次总攻，却均遭败绩，  蒋光鼐指挥军队在闸北、江湾、吴淞、曹家桥、浏河、八字桥一带  展开了多次战役，日军先后四次更换主帅，死伤近万人。
1930_038 = 一二八淞沪抗战：国民政府迁都洛阳
1930_039 = 为回避日军的猛攻，1932年1月30日，国民政府决定迁都洛阳。
1930_040 = 蒋介石复出
1930_041 = 伪满洲国成立
1930_042 = 一二八淞沪抗战：停战协定签订
1930_043 = 日本的军事行动同时损害了西方列强的在华利益，  欧美各国对日表示不满，于29日出面进行调停。2月，国际联盟作出决议，  要求中日双方停战谈判。中日双方于3月14日在英国驻上海  总领事馆举行停战谈判，于5月5日签订协定。  协定规定，日本军队可以长期留驻吴淞、闸北、江湾  引翔港等地，而中国军队却不能在上海周围驻扎设防。  日本因此躲过了外交危机，同时，因中国政府不能在上海布防，  致使上海门户大开，为日本发动全面侵华战争提供了条件。
1930_044 = 为巩固其反动统治，1931年11月，蒋介石提出“攘外必先安内”的方针，  同时加紧清洗反对派和共产党人。淞沪停战之后，蒋介石更是将该项方针定为了基本国策，决定先剿共后抗日。  这项政治主张充分暴露了蒋介石集团的反动本质，也展现了蒋介石的政治野心。  这项基本国策一直延续到十年内战结束。
1930_045 = 长城抗战：山海关战斗
1930_046 = 1933年1月1日，日军驻山海关铁路守备队在其司令部门前和附近分投数枚炸弹，  然后指称中国守军所为，遂借机猛攻山海关。尔后，其增援部队在飞机、  军舰和坦克的掩护下不断加强攻势。驻守在这里的东北军何柱国部只有1个团，  仍进行了英勇顽强的抵抗，打退日军多次进攻，  终因寡不敌众，被迫于3日下午退出山海关。
1930_047 = 希特勒上台
1930_048 = 啤酒馆政变失败后纳粹党失势。这个本该日趋消亡的极右翼政党，却又在大萧条时期再次兴起，  并日益壮大，成为了德国第一大党。愈来愈多的垄断资本家支持纳粹党。  1932年11月，大资产阶级和大地主联名上书魏玛共和国总统兴登堡，要求委任希特勒为总理。  最终，1933年1月30日，希特勒成为国家总理。
1930_049 = 经济危机
1930_050 = 这是一个持续性buff。
1930_051 = 长城抗战：热河失守
1930_052 = 1933年2月21日，热河战役爆发。装备不良，士气低落的东北军节节败退。  3月4日，省会承德失守，热河全境沦陷。热河的失守使全国大哗。  在蒋介石示意下张学良引咎辞职。3月12日国民政府发布命令，批准张学良辞去各兼职，  命军政部部长何应钦代理北平军分会委员长。
1930_053 = 长城抗战
1930_054 = 九一八事变后，日本加紧了对中国的侵略。  1933年3月至5月，国民革命军在长城的义院口、冷口、喜峰口、古北口等地，  抗击侵华日军进攻。我军顽强抵抗、浴血奋战，  但日军装备精良训练有素，长城沿线仍失守，平津危急。
1930_055 = 长城抗战：塘沽协定
1930_056 = 1933年5月，日军占领通州，国民党政府对侵入华北  的日军继续采取不抵抗政策，由何应钦出面  派熊斌与冈村宁次谈判，并签订了《塘沽协定》。协定规定：“中国军队撤退至延庆、昌平、  顺义、通州、香河、宝坻、林亭口、宁河、芦台所连之线以西、以南地区，  不得越该线，不得有挑战和骚乱行为；日本军队为确认第一项之实行情形，  随时用飞机及其他方法以行视察，中国方面应给予保护和方便”  实际上默认了日本帝国主义侵占东北三省和热河的合法性，并承认冀东为“非武装区”。  该协定的签订充分展现了蒋介石集团的反动性与对帝国主义的妥协性。
1930_057 = 罗斯福发表就职演说
1930_058 = 国会纵火案
1930_059 = 1933年2月27日22点，柏林消防队接到消息，国会大厦发生火灾。  直到23点30分，大火才被扑灭。经过消防员和警察对大火现场的检查，  发现了20捆未烧尽的纵火燃料和一个赤裸的冻得哆嗦的男人。次日，希特勒在普鲁士新闻公报的电台上发表讲话，  称“这种纵火行为是德国布尔什维克进行的最骇人听闻的恐怖主义行为”。
1930_060 = 察哈尔抗战
1930_061 = 5月26日，冯玉祥在张家口通电成立察哈尔民众抗日同盟军，  自任总司令，方振武任前敌总司令，吉鸿昌任前敌总指挥。  队伍从几千人迅速扩展至十几万人。同盟军接受中共河北省前线工作委员会的指导。  6月15日，察哈尔民众抗日同盟军在张家口召开第一次代表大会，  确定了同盟军的政治、军事纲领。其主要内容是：  外抗暴日，武装保卫察哈尔，收复失地；对日绝交，  反对中央当局签订《塘沽协定》等妥协外交，肃清卖国贼，  没收汉奸军阀一切财产及日货等。  察哈尔民众抗日同盟军先后收复了被日军占领的  康保、宝昌、沽源、多伦等察省失地。  8月，冯玉祥撤销抗日同盟军总部，辞去抗日同盟军总司令一职。
1930_062 = 察哈尔抗战：同盟军的失败
1930_063 = 冯玉祥辞职后，在内外反动势力的联合围剿下，同盟军宣告失败。
1930_064 = 福建事变
1930_065 = 1933年11月，蔡廷锴联合李济深等，在福建成立“中华共和国  人民革命政府”，由李济深任主席。规定以福州为首都，  更年号为“中华共和国元年”
1930_066 = 德波互不侵犯条约
1930_067 = 1934年1月26日，德国和波兰在柏林签订《互不侵犯条约》，  同年2月24日生效。
1930_068 = 长刀之夜
1930_069 = 希特勒因无法控制冲锋队的街头暴力并视之为对权力的威胁，  故欲除去冲锋队。他还想安抚厌恶冲锋队的国防军高层。  最后，希特勒清算其政权的政敌。至少有85人死于清算，不过最后的死亡人数可能  达上百个。超过一千的反对者被逮捕，参与行动的大部分  是党卫队及盖世太保，此次行动加强并巩固了国防军对希特勒的支持。
1930_070 = 元首独裁
1930_071 = 1934年8月2日，德国总统兴登堡去世。  兴登堡去世后，希特勒立马将总理和总统合并为元首，  他的个人独裁时代才刚刚开始。
1930_072 = 苏联农业集体化政策
1930_073 = 在全盘集体化运动中，苏联实行依靠贫农、团结中农、消灭富农的政策。  规定没收富农财产,转为集体农庄公积金，作为贫雇农入庄费（共约4亿卢布）  ，并把富农驱逐出本区、州（边疆区），不准加入集体农庄。  苏联农业集体化是在激烈的阶级斗争中实现的,在全盘集体化运动期间,富农杀害牲畜、  纵火、暗杀、组织动等等破坏活动屡见不鲜。  为了促使集体化运动开展，苏联在分配土地，供应机器和拖拉机、种子，减轻赋税，发放贷款等方面，  给予集体农庄以优待。从1929年起，苏联建立机器拖拉机站，  从组织上、物质技术上帮助集体农庄巩固和发展。
1930_074 = 乌克兰大饥荒
1930_075 = 1932年初，在乌拉尔地区和西西伯利亚地区开始出现一定规模的饥荒。  不久，在乌克兰的44个区也出现了饥荒。这年夏天，饥荒一度停止，  秋天再度发生，一直持续到1933年底。作为苏联最重要的产粮区，  乌克兰在这场饥荒中受害最深，死亡人数特别引人关注。  西方研究者罗伯特·康奎斯特在其著作中提出，饥荒中乌克兰的死亡人数“保守估计”约有500万。
1930_076 = 基洛夫事件
1930_077 = 1934年12月1日是基洛夫的一个照常工作日，但也是他生命历程中最后一天。这也是即将席卷全国镇压狂潮掀开序幕的一天。  这一天傍晚当基洛夫走进在列宁格勒州委机关所在地斯莫尔尼宫，向州委第二书记的办公室走去。  当他在走廊里停下脚步开门时，精神病人的子弹射中他的脖子。  他摇晃了一下，转过半个身子，就一头栽倒在镶木地板上。
1930_078 = 肃反运动展开
1930_079 = 基洛夫遇刺事件直接触发了大肃反，托洛茨基、季诺维也夫、加米涅夫、图哈切夫斯基、布哈林等  大批党、政、军领导人还有经济学家康得拉季耶夫和恰亚诺夫、生物学家瓦维洛夫、作家巴别尔  、植物学家米歇耶夫、著名外科医生科赫、坦克设计师扎斯拉夫斯基、无后坐力炮发明者库尔切夫斯基、  飞机设计师图波列夫、第一批火箭发动机的研制者火箭科学研究所所长克列伊梅诺夫、  喀秋莎火箭炮的发明者朗格马克、苏联第一颗人造卫星的总设计师科罗廖夫、实用矿物学创始人费多罗夫斯基  等著名知识分子以至普通干部和群众被加以各种罪名，  遭到残酷的镇压和迫害。这段时期典型的现象包括无处不在的政治审查、  到处都存在的怀疑“间谍破坏”、做秀公审（沙赫特案件、工业党审判、莫斯科大审判等）  、关押和死刑，使斯大林的个人崇拜达到了前所未有的状态，  同时也使苏联的党、政、军、科学文化界失去了一大批优秀骨干，使社会主义失去了一次自我完善的机会。
1930_080 = 察东事变
1930_081 = 1935年1月15日，伪满“自卫团”与驻防察哈尔省沽源县的国民党29军宋哲元部发生“冲突”。  宋哲元马上请北平政务整理委员会委员长黄郛出面与日本交涉。双方刚刚谈判，  又发生因日伪军在察东劫掠百姓而被29军官兵收缴40人武器的事件。这个事件，本是29军  维持地方治安的正常行动，但日本关东军认为抓住了借口，诬告为“宋  哲元军侵犯满洲国国境”，随即兵分两路向察东大举进攻。  2月2日，中日双方在热河省丰宁县大滩镇日军司令部举行谈判会议，签订了《大滩口约》。    大滩口约确认了沽源到独石口的延伸停战线，削弱了中国方面对沽源长城以东地区的控制，  使察东出现了一个约700平方公里的“非军事区”，日军虽未完全达到  占领察东目的，但国民党政府却实际上  丧失了对沽源县长城以东地区的控制。
