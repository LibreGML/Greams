10001 = 虽然在过去的几年里，我们重归大陆，并且确认了其最终统治地位，但是祖国的很多地方仍处于军政府的独立之中。人民偏安一隅，总体上甚至对我们党国并无认同感。在前几年的党的十大上，连战提出要加强对这些地区的宣传，振兴三民主义，启发人民的思潮，以便于迎接接下来的统一战争。
10002 = 今天的《泰晤士报》刊登了一则紧急新闻：印度内战全面爆发。  对于这样一则消息，人们似乎并不感到意外。早在前几年，印度就因为宗教等一系列原因而分裂。最近几年愈演愈烈，联邦政府不断攻击共和政府，共和政府也丝毫不肯让步。  根据新闻报道，4月4日早八点，联邦政府军队突然大肆攻击共和政府军队，双方战争一触即发
