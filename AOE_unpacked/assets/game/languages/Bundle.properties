1930_CHI_DSEC = 四一二事件后，国民大革命实际已经失败，国民党反 动派为巩固统治，篡改了孙文先生的遗嘱，并大肆迫害工农。宁汉合流后 ,国民政府实质已经成为代表地主、买办性的大资产阶级的政府。1928年， 以蒋介石为首的国民党新军阀推翻了北洋旧军阀的统治。北 伐成功以后,。 南京政府名义上是中央，但无权威可言， 当时中国之状况，与此前军阀割据之形势别无二致。一场血流成河的战争之后,根本问题并未得到解决。如果非要 说有变化，那就是各方军事力量重新洗了一次牌。 1930年代的经济大萧条,使欧美各国自顾不暇， 本应是中国振作的时机，但中国积重难返。蒋桂大战后, 桂系势力被大大削弱,但桂系军阀的失败也使得 蒋介石集团与阎锡山、冯玉祥等部的矛盾加剧，并给人民带来了更大的灾难。 另一边,以共产党为代表的左翼势力逐渐在国内  崛起， 工农割据的局面已然初步形成，左翼的兴起同样威胁着新兴国民政府的统治。 内耗 使1930年中国的危机并不亚于欧美各国。
1930_GER_DSEC = 魏玛共和国的体制既不能平息资本家的怒火，也不能阻止工人们的游行。  1929年经济危机爆发，美国的大萧条波及魏玛共和政府。  在危机以后，德国的达姆斯纳特国家银行破产，德国股市崩溃。数以千计的银行和企业破产，  失业工人剧增，直至第二年，工人失业人数递增到了220万。  同时，国内极端思想与纳粹党的兴起也令共和政府危机重重。
1930_USA_DSEC = 一战中，欧洲交战国对军需物资的需求，为美国提供了  增加工业生产和扩大商品输出的机会。大战结束时，  整个世界的国际贸易缩减到战前的60％，美国对外贸易却大量增长。  战争后，美国经济得到了飞速发展。美国的工业生产  指数在1921年时平均仅为67，但到1928年7月时已上升到110，  到1929年6月时则上升到126。给人印象更为深刻的是美国  股票市场的行情。实业家、学究式  的经济学家和政府领导人都表示对未来充满信心。但由于股票投机成风，  繁荣本身带有一定虚假性，使这种繁荣孕育着新的危机。1929年10月29日，  “黑色星期二”的到来终于打破了这场柯立芝式的“繁荣幻梦”。  这一天，纽约股票市场崩溃，资本主义世界经济大危机由此爆发。  时间来到1930年，新上任一年的总统胡佛并没有着力改变这一切，  仍然延续着自由主义政策，美国依然面临着失业率暴增、农产品价格暴跌、  工厂倒闭、银行破产等一系列社会问题。  来和我一起念：自由美利坚，失业每一天！
1930_UK_DSEC = 英国，这个昔日的世界霸主在血腥的大战后日渐衰落，以至于丧失了  霸主的地位。1922年，英国被迫承认埃及独立，庞大的殖民帝国也逐步走向瓦解。  不过在大萧条中，英国所遭受的损失并没有比其他国家严重，  由于其相对疲软的经济，使它的金融业所受到的损失并没有过于严重，在传统的煤炭纺织  等工业受到冲击的同时，新兴工业  趁机发展，虽然救济金减少，但英国的民主传统并没有使极端主义猖狂。  时间来到1930年，此时的英国该如何走出困境？
1930_FRA_DSEC = 在外交层面，法国政策的首要目标始终不变，那就是安全。  从1914年8月到1918年11月，德国杀死了135万法国年轻人，蹂躏了法国最富裕  的北部工业区，迫使法国以史无前例的规模消耗国家财富和资源来  进行战争。尽管这场战争法国获得了胜利，  但它最大的教训却是避免再次获得这样的胜利。因此，法国大战略的首要目标  在于保护法国不受其东方邻国——德国的攻击。为了寻求国家安全，1920年法国和比利时军方领导人进行谈判，  使两国承诺对德国未来可能使用武力做出反应。1921年法国与波兰签订条约，  承诺“为了保卫它们的领土采取协调一致的措施”。1924年法国同捷克斯洛伐克缔结条约，  规定受到攻击将相互援助。1926年法国加强了  同罗马尼亚的联系。1927同南斯拉夫签订友好协约。  后三国也因此相互缔约，结成了“小协约国”。  为了寻求国家安全，1928年，法国又决定在东北边境构筑梅斯、  劳特尔和贝尔福3个独立的筑垒地域。1929年12月马奇诺任陆军部长，  经他努力，法国国会于1930年通过了沿东北部  边境修建绵亘防线的巨额拨款。于是，防线即全面  展开施工，这便是著名的“马奇诺防线”。
1930_SOV_DSEC = 1924年1月21日，列宁同志去世。在莫斯科内部，斯大林派和托洛茨基派展开了激烈的“路线斗争"。  托洛茨基认为，社会主义革命只有在欧洲主要国家同时发生才能取得胜利。  主张跳过民主革命阶段直接进行社会主义革命。  而斯大林认为社会主义革命  可以从一国开始、在各国进行、在世界范围内完成。两派展开了激烈的斗争  最终，斯大林战胜了托洛茨基反对派。1929年1月，托洛茨基被驱逐出境。斯大林派赢得了最终的胜利。  然而，内部的斗争依然没有结束，斯大林将如何巩固党内的统治？
